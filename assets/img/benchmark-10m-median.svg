<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc">
<title id="title">Median KPI recalculation latency by engine and filter change</title>
<desc id="desc">Ten million synthetic rows. Seven scenarios. Pandas typically takes 552 to 1028 milliseconds; eager Polars 267 to 556; Cython and Rust bridges to C++ take approximately 62 to 126 milliseconds. Logarithmic y-axis, lower is better.</desc>
<rect width="1000" height="610" fill="#ffffff"/>
<text x="112" y="53" font-family="system-ui,sans-serif" fill="#18313a" font-weight="700" font-size="26">10M event filter-change benchmark</text>
<text x="112" y="83" font-family="system-ui,sans-serif" fill="#62747b" font-size="15">Median latency · filter + monthly KPIs · 30 repeats · lower is better</text>
