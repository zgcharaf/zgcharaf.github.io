---
layout: default
---

<article class="post">
<article class="section-card post-wrapper">
  <header class="post-header">
    <p class="post-meta">{{ page.date | date: '%B %d, %Y' }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}
      <p class="post-description">{{ page.description }}</p>
      <p class="lead">{{ page.description }}</p>
    {% endif %}
  </header>
  <div class="post-content">
    {{ content }}
  </div>
  <footer class="post-footer">
    <a href="{{ '/blog/' | relative_url }}">← Back to the archive</a>
    <a class="button secondary" href="{{ '/blog/' | relative_url }}">← Back to all posts</a>
  </footer>
</article>
