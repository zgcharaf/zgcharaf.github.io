<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Sans+3:wght@400;600&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <header class="site-header" role="banner">
    <div class="site-container header-inner">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title | default: 'Research Notes' }}</a>
      <nav class="site-nav" aria-label="Primary">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="{{ '/publications/' | relative_url }}">Publications &amp; Talks</a>
        <a href="{{ '/teaching/' | relative_url }}">Teaching</a>
        <a href="{{ '/blog/' | relative_url }}">Archive</a>
        {% if site.email %}
          <a href="mailto:{{ site.email }}">Contact</a>
        {% endif %}
      </nav>
    </div>
  </header>
  <main id="content" class="site-main" role="main">
    <div class="site-container">
      {{ content }}
    </div>
  </main>
  <footer class="site-footer" role="contentinfo">
    <div class="site-container">
      <p>&copy; {{ site.time | date: '%Y' }} {{ site.title | default: 'Research Notes' }}. Built with Jekyll.</p>
    </div>
  </footer>
</body>
</html>
