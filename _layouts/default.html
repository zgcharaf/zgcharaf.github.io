<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/engineering.css' | relative_url }}">
  <script>
    MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
      options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre'] }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <header class="site-header" role="banner">
    <div class="site-container header-inner">
      <a class="site-title" href="{{ '/' | relative_url }}">CZ<span class="eng-brand-dot">.</span><span class="eng-brand-word"> / CHARAF ZGUIOUAR</span></a>
      <nav class="site-nav" aria-label="Primary">
        <ul class="nav-list">
          <li><a class="nav-link" href="{{ '/' | relative_url }}">Home</a></li>
          <li><a class="nav-link" href="{{ '/blog/' | relative_url }}">Writing</a></li>
          <li><a class="nav-link" href="{{ '/' | relative_url }}#projects">Projects</a></li>
          <li><a class="nav-link" href="{{ '/about/' | relative_url }}">About</a></li>
          <li><a class="nav-link" href="{{ '/publications/' | relative_url }}">Research</a></li>
          <li><a class="nav-link" href="{{ '/teaching/' | relative_url }}">Teaching</a></li>
          <li><a class="nav-link nav-contact" href="mailto:{{ site.email }}">Contact ↗</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main id="content" class="site-main" role="main"><div class="site-container">{{ content }}</div></main>
  <footer class="site-footer" role="contentinfo">
    <div class="site-container eng-footer-inner"><span>© {{ site.time | date: '%Y' }} Charaf Zguiouar · Built with Jekyll</span><span>Measure · Simplify · Ship</span><a href="https://github.com/{{ site.github_username }}">GitHub ↗</a></div>
  </footer>
</body>
</html>
